<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Project Walk</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--wood:#6b4423;--wood2:#a86f3d;--paper:#fff8e7;--ink:#3b2a20;--mute:#8a7464;--sage:#6aa84f}
*{box-sizing:border-box}
body{margin:0;background:#2b2233;color:#f5ead8;font:16px 'Pixelify Sans',monospace;display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px}
.game{width:100%;max-width:800px;border:6px solid var(--wood);border-radius:8px;background:var(--wood);box-shadow:0 0 0 2px #3b2414,0 8px 0 #0004}
.stage{position:relative;background:#7cc66a}
canvas#c{display:block;width:100%;image-rendering:pixelated}
.px{image-rendering:pixelated;vertical-align:middle}
button{font:inherit;cursor:pointer;border:3px solid var(--wood);background:var(--paper);color:var(--ink);padding:4px 12px;border-radius:4px;box-shadow:0 3px 0 var(--wood)}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--wood)}
button.go{background:var(--sage);color:#fff;border-color:#3f6e2c;box-shadow:0 3px 0 #3f6e2c}
button.on{background:#ffd34d}
/* dialog box */
.dialog{display:flex;gap:12px;background:var(--paper);color:var(--ink);border-top:6px solid var(--wood);padding:10px 12px;min-height:118px}
.face{flex:none;width:76px;height:76px;background:#e9dcc0;border:3px solid var(--wood2);border-radius:6px;image-rendering:pixelated}
.dname{font-weight:600;color:#c0563f}.dtx{min-height:44px;line-height:1.3;white-space:pre-line}
.dbtn{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
/* in-game scene */
#scene{--px:3px;--wp:4px;display:none;min-height:460px;padding:44px 14px 120px;position:relative;overflow:hidden;
 background:repeating-linear-gradient(#c98f5a 0 14px,#b57d4b 14px 16px) bottom/100% 30% no-repeat,repeating-linear-gradient(90deg,#f6e3c6 0 14px,#f0d6ae 14px 28px)}
.stage.inscene canvas#c{display:none}
@media(max-width:600px){#scene{--px:2px;--wp:3px}}
.deco{position:absolute;image-rendering:pixelated;pointer-events:none}#panelWrap{position:relative;z-index:1}#panelWrap .panel{max-width:560px}
.steam{position:absolute;width:var(--px);height:var(--px);background:#fff;opacity:0;animation:steam 2.4s linear infinite}
@keyframes steam{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(calc(var(--px)*-12));opacity:0}}.stage.inscene #scene{display:block}
.x{position:absolute;top:8px;right:8px;padding:0 8px}
.panel{background:var(--paper);color:var(--ink);border:4px solid var(--wood);border-radius:6px;box-shadow:4px 4px 0 #0003;padding:12px;max-width:600px;margin:0 auto}
.panel h3{margin:0 0 8px;font-size:20px;display:flex;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.big{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px}
.steps div{color:var(--mute);padding:2px 0}.steps .done{color:var(--ink)}.steps .done::before{content:"✔ ";color:var(--sage)}
.ing{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.ing span{background:#f3ead6;border-radius:4px;padding:2px 8px 2px 4px;display:flex;align-items:center;gap:4px}
.res{display:flex;align-items:center;gap:10px;padding:6px;border-bottom:2px dashed #e3d6bb;cursor:pointer}.res:hover{background:#f6efdc}
.bars{margin-left:auto;font-size:13px;color:var(--mute)}.bar{display:inline-block;width:60px;height:8px;background:#e3d6bb;vertical-align:middle;margin-left:4px}.bar i{display:block;height:100%;background:var(--sage)}
.search{background:#fff;border:3px solid #e3d6bb;border-radius:4px;padding:6px 10px;margin-bottom:8px;min-height:36px}
.card-photo{background:#fffdf5;background-image:repeating-linear-gradient(#fffdf5 0 19px,#cfe0f2 19px 20px);padding:4px 12px;font:italic 15px/20px 'Comic Sans MS',cursive;color:#3a4a7a;transform:rotate(-1.5deg);max-width:260px;border:1px solid #e3d9bf;margin:4px auto}
.wave{display:flex;gap:2px;align-items:center;justify-content:center;height:34px}.wave i{width:4px;background:var(--sage)}
.out{white-space:pre-wrap;background:#f3ead6;border-radius:4px;padding:8px;min-height:70px}
.soon{background:#ffd34d33;border:3px dashed #e0a458;border-radius:6px;padding:16px;text-align:center;font-size:18px;margin-top:8px}.panel a{color:#2f5aa8}
#scene:not(.kitchen) .k{display:none}
.ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;font-size:14px}
*{border-radius:0!important}.card-photo{transform:none!important}
</style></head><body>

 `<canvas id="kdog" class="deco" width="24" height="28" onclick="kJump=0" style="pointer-events:auto;cursor:pointer;bottom:14px;left:50%;transform:translateX(-50%);width:calc(var(--px)*24);height:calc(var(--px)*28)"></canvas>`+

function board(s,on,t){const x=s.x;
 g.fillStyle="#7a4f2e";g.fillRect(x-14,86,3,22);g.fillRect(x+11,86,3,22);
 g.fillStyle="#6b4423";g.fillRect(x-17,70,34,22);g.fillStyle="#a86f3d";g.fillRect(x-16,71,32,20);

 if(on){const by=62+Math.round(Math.sin(t/8)*1.5);g.fillStyle="#ffd34d";g.fillRect(x-1,by,2,5);g.fillRect(x-1,by+6,2,2)}}
const clouds=Array.from({length:Math.ceil(WW/100)},(_,k)=>[40+k*100,10+(k*7)%14,.6+(k%3)*.2]),flies=Array.from({length:Math.ceil(WW/130)},(_,k)=>[80+k*130,95+(k%2)*5,k%2?"#ffd34d":"#fff"]);

 const tx=stops[i].x,moving=Math.abs(tx-x)>0.5;
 if(moving){dir=Math.sign(tx-x);x+=dir;f++;shown=-2}else if(shown!==i&&!inScene)arrive();

 if(inScene){kitchenDog(t);requestAnimationFrame(draw);return}

 g.drawImage(bg,0,0);
 clouds.forEach(c=>{const cx=((c[0]+t*.05*c[2])%(WW+40))-20;g.fillStyle="#fff";g.fillRect(cx,c[1],22,5);g.fillRect(cx+4,c[1]-3,12,3);g.fillRect(cx+2,c[1]+5,18,1)});
 stops.forEach((s,k)=>{if(s.board)board(s,k===i&&!moving,t)});
 flies.forEach((q,k)=>{const bx=q[0]+Math.sin(t/40+k)*30,by=q[1]+Math.sin(t/13+k)*4,o=(t/4|0)%2;g.fillStyle=q[2];g.fillRect(bx-1-o,by,1,1+o);g.fillRect(bx+1+o,by,1,1+o);g.fillStyle="#3b2a20";g.fillRect(bx,by,1,2)});
 if(jumpT<0&&Math.random()<.005)jump();
 const lift=jumpT<0?0:Math.round(Math.sin(jumpT/26*Math.PI)*9);if(jumpT>=0&&++jumpT>26)jumpT=-1;
 drawChar(g,x,GROUND,dir,moving,lift||(moving&&(f>>3)%2),t,lift);
 g.restore();requestAnimationFrame(draw)}
function arrive(){shown=i;const s=stops[i];

function go(d){if(!inScene)i=Math.max(0,Math.min(stops.length-1,i+d))}
function enter(){const s=stops[i];if(!s.scene)return;inScene=true;$("stage").classList.add("inscene");$("scene").classList.toggle("kitchen",s.scene==="recipe");s.scene==="recipe"?recipe.start():soon(s)}
function leave(){inScene=false;$("stage").classList.remove("inscene");$("panelWrap").innerHTML="";shown=-1}
const scene=html=>{$("panelWrap").innerHTML=`<div class="panel">${html}</div>`};

/* ---------------- coming-soon room (other projects) ---------------- */
function soon(s){const p=s.proj,links=[p.url&&`<a href="${p.url}" target="_blank" rel="noopener">🌐 Website</a>`,p.github&&`<a href="${p.github}" target="_blank" rel="noopener">💻 GitHub</a>`].filter(Boolean).join(" · ");

  <div class="soon">🚧 Interactive demo coming soon! 🚧</div>${links?`<p style="margin:10px 0 0">${links}</p>`:""}`);
 say(LINES.soon,[["🚪 Back outside",leave,"go"]])}

/* ---------------- Recipe Book AI scene ---------------- */
const book=[
 {t:"Toy Tomato Egg Soup",vi:"Canh cà chua trứng",pic:"soup",ing:["tomato","egg","onion","stock"],ingVi:["cà chua","trứng","hành","nước dùng"],tags:["soup","quick"],mood:["warm","cozy","cold","comfort","light"],steps:["Soften onion and tomato.","Add stock and simmer.","Swirl in beaten egg."],stepsVi:["Xào mềm hành và cà chua.","Thêm nước dùng và đun liu riu.","Đổ trứng đã đánh vào, khuấy nhẹ."]},
 {t:"Toy Fried Rice",vi:"Cơm chiên",pic:"rice",ing:["rice","egg","peas","soy sauce"],ingVi:["cơm","trứng","đậu Hà Lan","nước tương"],tags:["leftovers","quick"],mood:["filling","fast","leftover","easy"],steps:["Scramble egg, set aside.","Fry rice and peas hot.","Season with soy, fold egg back in."],stepsVi:["Chiên trứng bác, để riêng.","Xào cơm và đậu Hà Lan trên lửa lớn.","Nêm nước tương, cho trứng vào trộn đều."]},
 {t:"Toy Garlic Noodles",vi:"Mì xào tỏi",pic:"noodles",ing:["noodles","garlic","butter","soy sauce"],ingVi:["mì","tỏi","bơ","nước tương"],tags:["noodles"],mood:["comfort","savory","craving","easy"],steps:["Boil noodles.","Melt butter with garlic.","Toss noodles with garlic butter and soy."],stepsVi:["Luộc mì.","Đun chảy bơ với tỏi.","Trộn mì với bơ tỏi và nước tương."]}];

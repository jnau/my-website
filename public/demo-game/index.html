<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Project Walk</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--wood:#6b4423;--wood2:#a86f3d;--paper:#fff8e7;--ink:#3b2a20;--mute:#8a7464;--sage:#6aa84f}
*{box-sizing:border-box}
html,body{height:100%}body{margin:0;background:#2b2233;color:#f5ead8;font:16px 'Pixelify Sans',monospace}
/* fixed zones: game view (flexes), dialog box and button bar (fixed heights) */
.game{height:100%;display:flex;flex-direction:column;background:var(--wood)}
.stage{flex:1;min-height:0;position:relative;overflow:hidden;background:#a9e1f5}
canvas#c{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.px{image-rendering:pixelated;vertical-align:middle}
button{font:inherit;cursor:pointer;border:3px solid var(--wood);background:var(--paper);color:var(--ink);padding:4px 12px;min-height:40px;border-radius:4px;box-shadow:0 3px 0 var(--wood)}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--wood)}
button.go{background:var(--sage);color:#fff;border-color:#3f6e2c;box-shadow:0 3px 0 #3f6e2c}
button.on{background:#ffd34d}
/* dialog box */
.dialog{flex:none;height:112px;position:relative;display:flex;gap:10px;background:var(--paper);color:var(--ink);border-top:6px solid var(--wood);padding:8px 12px;cursor:pointer;user-select:none}
.face{flex:none;width:64px;height:64px;background:#e9dcc0;border:3px solid var(--wood2);image-rendering:pixelated}
.dname{font-weight:600;color:#c0563f}.dtx{height:3.9em;overflow:hidden;line-height:1.3;white-space:pre-line}
#more{position:absolute;right:12px;bottom:6px;color:#c0563f;animation:bob 1s steps(2) infinite}@keyframes bob{50%{transform:translateY(3px)}}
.ctrlbar{flex:none;display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--wood)}.ctrlbar .arrow{flex:none;width:52px}
#dbtn{flex:1;min-width:0;display:flex;gap:8px;justify-content:center;overflow-x:auto}#dbtn button{white-space:nowrap}
#jump{position:absolute;top:8px;left:8px;z-index:3;font:inherit;font-size:14px;max-width:70%;padding:4px 6px;border:3px solid var(--wood);background:var(--paper);color:var(--ink)}
body.inscene #jump{display:none}body.inscene .arrow{display:none}
/* buttons stay centered; say() always puts Outside last */
.panel{animation:fadein .25s ease-out}@keyframes fadein{from{opacity:0;transform:translateY(6px)}}.panel.busy{opacity:.55;transition:opacity .2s}
/* in-game scene */
#scene{--px:3px;--wp:4px;display:none;position:absolute;inset:0;overflow:hidden;
 background:repeating-linear-gradient(#c98f5a 0 14px,#b57d4b 14px 16px) bottom/100% 30% no-repeat,repeating-linear-gradient(90deg,#f6e3c6 0 14px,#f0d6ae 14px 28px)}
body.inscene canvas#c{display:none}
@media(max-width:600px){#scene{--px:2px;--wp:3px}}
.deco{position:absolute;image-rendering:pixelated;pointer-events:none}#panelWrap{position:absolute;left:10px;right:10px;top:10px;bottom:calc(var(--px)*30 + 16px);overflow-y:auto;z-index:1}#panelWrap .panel{max-width:560px}body.short #panelWrap{bottom:10px}
.steam{position:absolute;width:var(--px);height:var(--px);background:#fff;opacity:0;animation:steam 2.4s linear infinite}
@keyframes steam{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(calc(var(--px)*-12));opacity:0}}body.inscene #scene{display:block}
.panel{background:var(--paper);color:var(--ink);border:4px solid var(--wood);border-radius:6px;box-shadow:4px 4px 0 #0003;padding:12px;max-width:600px;margin:0 auto}
.panel h3{margin:0 0 8px;font-size:20px;display:flex;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.big{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px}
.steps div{color:var(--mute);padding:2px 0}.steps .done{color:var(--ink)}.steps .done::before{content:"✔ ";color:var(--sage)}
.ing{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.ing span{background:#f3ead6;border-radius:4px;padding:2px 8px 2px 4px;display:flex;align-items:center;gap:4px}
.res{display:flex;align-items:center;gap:10px;padding:6px;border-bottom:2px dashed #e3d6bb;cursor:pointer}.res:hover{background:#f6efdc}
.bars{margin-left:auto;font-size:13px;color:var(--mute)}.bar{display:inline-block;width:60px;height:8px;background:#e3d6bb;vertical-align:middle;margin-left:4px}.bar i{display:block;height:100%;background:var(--sage)}
.search{background:#fff;border:3px solid #e3d6bb;border-radius:4px;padding:6px 10px;margin-bottom:8px;min-height:36px}
.card-photo{background:#fffdf5;background-image:repeating-linear-gradient(#fffdf5 0 19px,#cfe0f2 19px 20px);padding:4px 12px;font:italic 15px/20px 'Comic Sans MS',cursive;color:#3a4a7a;transform:rotate(-1.5deg);max-width:260px;border:1px solid #e3d9bf;margin:4px auto}
.wave{display:flex;gap:2px;align-items:center;justify-content:center;height:34px}.wave i{width:4px;background:var(--sage)}
.out{white-space:pre-wrap;background:#f3ead6;border-radius:4px;padding:8px;min-height:70px}
.soon{background:#ffd34d33;border:3px dashed #e0a458;border-radius:6px;padding:16px;text-align:center;font-size:18px;margin-top:8px}.panel a{color:#2f5aa8}
#scene:not(.kitchen) .k{display:none}
*{border-radius:0!important}.card-photo{transform:none!important}
</style></head><body>
<div class="game">
 <div class="stage" id="stage"><canvas id="c"></canvas><select id="jump" aria-label="Jump to a project"></select><div id="scene"><div id="deco"></div><div id="panelWrap"></div></div></div>
 <div class="dialog" id="dbox"><canvas class="face" id="face" width="20" height="20"></canvas>
  <div style="flex:1;min-width:0"><div class="dname" id="dname">Sparky</div><div class="dtx" id="dtx"></div></div><span id="more">▼</span></div>
 <div class="ctrlbar"><button class="arrow" id="prev" aria-label="Walk back">◀</button><div id="dbtn"></div><button class="arrow" id="next" aria-label="Walk forward">▶</button></div>
</div>
<script>
const $=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms));
/* ---------------- pixel sprites ---------------- */
const PAL={K:"#2a1a1f",R:"#e8603c",G:"#5fb052",H:"#9ad27a",W:"#fffaf0",Y:"#ffd34d",P:"#c98bd6",L:"#ecd3f2",B:"#7fb3d5",O:"#e9a65a",N:"#f6d58a",D:"#6b3f22",S:"#9a9aa8"};
const bowl=["KKKKKKKK","KBBBBBBK",".KBBBBK.","..KKKK..","........"];
const ICON={
 tomato:["...GG...","..KGGK..",".KRRRRK.","KRRWRRRK","KRRRRRRK","KRRRRRRK",".KRRRRK.","..KKKK.."],
 egg:["..KKKK..",".KWWWWK.","KWWYYWWK","KWYYYYWK","KWYYYYWK","KWWYYWWK",".KWWWWK.","..KKKK.."],
 onion:["...KK...","...GK...","..KPPK..",".KPPPPK.","KPPLPPPK","KPPLPPPK",".KPPPPK.","..KKKK.."],
 garlic:[["...KK...","...WK...","..KWWK..",".KWWWWK.","KWWSWWWK","KWWSWWWK",".KWWWWK.","..KKKK.."]],
 rice:["........","..WWWW..",".WWWWWW.",...bowl],
 noodles:["........",".NONNON.",".NNONNN.",...bowl],
 soup:["........",".RRWRRR.",".RWWRRR.",...bowl],
 banana:["......K.",".....KYK","....KYYK","...KYYK.","KKKYYK..","KYYYK...",".KKK....","........"],
 peas:["........","........","..KKKKK.",".KGHGHGK","KGGGGGK.",".KKKKK..","........","........"],
 soy:["...KK...","...RK...","..KDDK..",".KDDDDK.",".KDWWDK.",".KDWWDK.",".KDDDDK.","..KKKK.."],
 butter:["........","........","...KKKKK","..KYYYYK",".KYYYYKK","KYYYYKK.","KKKKKK..","........"],
 pancake:["........","...YY...","..KYYK..",".KOOOOK.",".KNNNNK.","KOOOOOOK","KKKKKKKK","........"],
 link:["..KKKK..",".KBBGBK.","KBGGBBBK","KBBGGBBK","KBBBGGBK","KBGBBBBK",".KBBBBK.","..KKKK.."],
 pdf:[".KKKKK..",".KWWWKK.",".KWWWWK.",".KRRRWK.",".KWWWWK.",".KWKKWK.",".KWWWWK.",".KKKKKK."],
 card:["........","KKKKKKKK","KWWWWWWK","KWRRRWWK","KWWWWWWK","KWKKKKWK","KWWWWWWK","KKKKKKKK"],
 mic:["..KKK...",".KSSSK..",".KSSSK..",".KSSSK..","K.KKK.K.",".K...K..","..KKK...","...K...."],
 book:["KKKKKKK.","KRRRRRKK","KRYRRRKW","KRRRRRKW","KRRRRRKW","KRRRRRKW","KKKKKKKW",".WWWWWWW"]};
ICON.garlic=ICON.garlic[0];
const urlCache={};
function icon(k,s=4){if(!ICON[k])return"";if(!urlCache[k]){const c=document.createElement("canvas");c.width=c.height=8;const x=c.getContext("2d");
 ICON[k].forEach((r,y)=>[...r].forEach((ch,xx)=>{if(PAL[ch]){x.fillStyle=PAL[ch];x.fillRect(xx,y,1,1)}}));urlCache[k]=c.toDataURL()}
 return`<img class="px" src="${urlCache[k]}" width="${8*s}" height="${8*s}" alt="">`}
const ING={tomato:"tomato",egg:"egg",onion:"onion",garlic:"garlic",rice:"rice",noodles:"noodles",banana:"banana",peas:"peas","soy sauce":"soy",butter:"butter",stock:"soup"};

/* ---------------- characters ---------------- */
// Sparky, facing right. alt = walk frame, eye = row hidden on blink, head = rows that bob when idle
const CH={
 dog:{rows:[".........K..K.....","........KOK.KPK...","........KOOKKPPK..","........KOOOOOOK..","........KOOOOEOOKK","........KOOOOOCCCN",
  "K.......KOOOOCCCK.","OK.....KRRRCCCKK..",".OKKKKBBBBBCK.....",".KOOOOBbBBBCK.....",".KOOOOBBBbBCK.....",".KOOOOOOOOCCK.....",
  "..KOK.....KCK.....","..KOK.....KCK.....","..KCK.....KCK.....","..KK......KK......"],
  alt:{12:"...KOK...KCK......",13:"...KOK...KCK......",14:"...KCK...KCK......",15:"...KK....KK......."},eye:4,skin:"O",head:8,
  pal:{K:"#3b2a20",O:"#d9a05b",P:"#f3c9a6",C:"#fbe9cf",E:"#1a1416",N:"#1a1416",R:"#c0392b",B:"#2f5aa8",b:"#ffffff"}}};
const who="dog";
function drawChar(c,x,feet,dir,walking,step,t,lift=0){const sp=CH[who],w=sp.rows[0].length,h=sp.rows.length,
  blink=(t%240)<8,bob=walking?0:(t/30|0)%2,x0=Math.round(x)-(w>>1);
 c.fillStyle="#0002";c.fillRect(x0+1,feet,w-2,1);
 sp.rows.forEach((r,yy)=>{if(step&&sp.alt[yy])r=sp.alt[yy];if(blink&&yy===sp.eye)r=r.replaceAll("E",sp.skin);
  [...r].forEach((ch,xx)=>{if(!sp.pal[ch])return;c.fillStyle=sp.pal[ch];c.fillRect(x0+(dir>0?xx:w-1-xx),feet-h+yy-lift+(yy<sp.head&&!lift?bob:0),1,1)})})}
function drawFace(){const c=$("face").getContext("2d"),sp=CH[who];c.clearRect(0,0,20,20);
 const w=sp.rows[0].length,h=sp.rows.length,ox=(20-w)>>1,oy=(20-h)>>1;
 sp.rows.forEach((r,y)=>[...r].forEach((ch,x)=>{if(sp.pal[ch]){c.fillStyle=sp.pal[ch];c.fillRect(ox+x,oy+y,1,1)}}))}

/* ---------------- Sparky's lines: edit these! ---------------- */
// Keep them short. " Woof!" is added to the end of every line automatically.
const LINES={
 hello:"Hi! I'm Sparky, Jessica's dog. Let's go for a walk!",
 howto:"Tap ◀ ▶ to walk, or tap me to make me jump!",
 bye:"That's the tour! Thanks for the pets.",
 peek:"Wanna peek inside?",
 // what Sparky says at each signboard, matched by project title
 projects:{
  "Recipe Book AI":"Jessica's recipe book. I'm mostly here for the chicken.",
  "High Definition Single Base Substitution Mutational Signatures in Human Cancers":"Big science about tiny DNA typos. Very fancy.",
  "mSigLit-AI":"A robot that reads papers for Jessica. Good robot.",
  "Interactive HD Dashboards":"Charts you can chew on! I prefer chewing bones though.",
  "ENCODEd Database":"A giant genome library. I'd fetch from it if they let me."},
 projectDefault:"Sniff sniff… a project!",
 soon:"Still being built! Come back soon for treats.",
 explain:"Want to see how Jessica built it? Lots of wires, no bones.",
 recipe:{
  start:"Welcome in! Let's add a recipe. Where's it from?",
  url:"The recipe's hiding in the web page. The app sniffs it right out!",
  pdf:"The AI fishes the recipe out of the PDF and tidies it up.",
  photo:"Handwritten cards become real recipes. Paw prints and all!",
  voice:"Even recipes from a phone call with Mom, in Vietnamese and English!",
  preview:"Nothing saves until Jessica says so. Good human.",
  saved:"Saved and sniffable! I mean searchable.",
  search:"Now let's search! Fridge stuff or a craving?",
  results:"Sorted by meaning and by words. Tap one!",
  open:"Yum! Now try Tiếng Việt.",
  translating:"Translating…",
  translated:"All in Vietnamese now, and saved for next time!",
  cached:"Instant! It remembered."}};

/* ---------------- dialog ---------------- */
// Text is split into pages that fit the box; tap the box to finish typing or go to the next page.
let typer,pages=[],pg=0,typing=false;
function paginate(text){const el=$("dtx"),parts=text.match(/[^.!?…]+[.!?…]*\s*/g)||[text],out=[];let cur="";
 for(const p of parts){el.textContent=cur+p;if(cur&&el.scrollHeight>el.clientHeight+1){out.push(cur.trim());cur=p}else cur+=p}
 if(cur.trim())out.push(cur.trim());el.textContent="";return out}
function typePage(){clearInterval(typer);const el=$("dtx"),t=pages[pg]||"";let n=0;typing=true;el.textContent="";
 $("more").style.visibility="hidden";
 typer=setInterval(()=>{el.textContent=t.slice(0,n+=2);if(n>=t.length)doneTyping()},18)}
function doneTyping(){clearInterval(typer);typing=false;$("dtx").textContent=pages[pg]||"";$("more").style.visibility=pg<pages.length-1?"visible":"hidden"}
function say(text,buttons=[]){pages=text?paginate(text+" Woof!"):[""];pg=0;typePage();
 $("dbtn").innerHTML="";[...buttons].sort((a,b)=>(a[2]==="out")-(b[2]==="out")).forEach(([label,fn,cls])=>{const b=document.createElement("button");b.innerHTML=label;if(cls)b.className=cls;b.onclick=fn;$("dbtn").append(b)})}
$("dbox").onclick=()=>{if(typing)doneTyping();else if(pg<pages.length-1){pg++;typePage()}};

/* ---------------- world ---------------- */
// Fallback copy of projects.json "featured"; inside the site the game reads the live list from the parent page.
const FALLBACK=[{"title": "Recipe Book AI", "desc": "Personal recipe book with AI search. Add recipes from links, PDFs, photos of handwritten cards, or voice memos, then search by what's in your fridge or what you're craving. Any recipe can be read in Vietnamese.", "tags": ["Python", "LLMs", "RAG"], "year": "2026", "explainer": "/recipe-book/how-it-works.html"}, {"title": "High Definition Single Base Substitution Mutational Signatures in Human Cancers", "desc": "Reference set from 50,000+ WGS across multiple cancer types.", "tags": ["Python", "ML", "Statistics"], "year": "2023-present"}, {"title": "mSigLit-AI", "desc": "AI literature curation with automated extraction and classification.", "tags": ["Python", "NLP", "LLMs"], "year": "2025-present", "github": "https://github.com/jnau/msiglitai"}, {"title": "Interactive HD Dashboards", "desc": "Web exploration tools for HD Signature analysis", "tags": ["AWS", "HTML/CSS", "JavaScript", "Plotly"], "year": "2025-present"}, {"title": "ENCODEd Database", "desc": "Built full-stack features for the ENCODE portal: front-end UI components, JSON schema extensions, and back-end contributions to the SnoVault framework, with API test coverage and AWS deployment QA", "tags": ["AWS", "GCP", "Python", "Database"], "year": "2019-2021", "github": "https://github.com/ENCODE-DCC/encoded", "url": "https://www.encodeproject.org/"}];
let PROJ=FALLBACK;try{if(window.parent!==window&&window.parent.__projectsForGame)PROJ=window.parent.__projectsForGame}catch(e){}
const stops=[{line:`${LINES.hello} ${LINES.howto}`,x:30},
 ...PROJ.map((p,k)=>({line:`${p.title}\n${LINES.projects[p.title]||LINES.projectDefault}`,proj:p,x:100+k*70,board:true,scene:/recipe book/i.test(p.title)?"recipe":"soon"}))];
stops.push({line:LINES.bye,x:stops[stops.length-1].x+60});
const H=140,GROUND=116,WW=Math.max(420,stops[stops.length-1].x+30),cv=$("c"),g=cv.getContext("2d");let W=320,VH=H,cam=0;
// Size the canvas to the game view without stretching: the world fills at least ~65% of the height, extra becomes sky.
function fit(){const r=$("stage").getBoundingClientRect();if(!r.width||!r.height)return;
 const s=Math.min(Math.max(r.width/320,r.height*.65/H),r.height/H);W=Math.round(r.width/s);VH=Math.round(r.height/s);cv.width=W;cv.height=VH;document.body.classList.toggle("short",r.height<380)}
let i=0,x=stops[0].x,f=0,dir=1,shown=-1,inScene=false,jumpT=-1;
const jump=()=>{if(jumpT<0)jumpT=0};
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const bg=document.createElement("canvas");bg.width=WW;bg.height=H;const b=bg.getContext("2d");
const R=(c,x,y,w,h)=>{b.fillStyle=c;b.fillRect(x|0,y|0,w,h)};
const disc=(c,cx,cy,r)=>{for(let y=-r;y<=r;y++){const w=Math.round(Math.sqrt(r*r-y*y));R(c,cx-w,cy+y,w*2+1,1)}};
// ---- detailed world (prototype) ----
const P=(c,x,y)=>R(c,x,y,1,1);
// sky: bands with a dithered seam between each pair
const SKY=["#8fd3f0","#9fdaf2","#b0e1f5","#c2e9f7","#d5f1fa"];
SKY.forEach((c,k)=>{R(c,0,k*12,WW,k===4?30:12);if(k)for(let x=0;x<WW;x++)for(let y=0;y<2;y++)if((x+y)%2)P(SKY[k-1],x,k*12+y)});
// far blue hills
for(let x=0;x<WW;x++){const h=Math.round(14+5*Math.sin(x/53+1)+3*Math.sin(x/19));R("#b5dcc8",x,66-h,1,h+12);P("#c9e7d6",x,66-h);if(x%2)P("#a6d2bc",x,66-h+3)}
// near hills: highlight lip, body, dithered shade toward the bottom
for(let x=0;x<WW;x++){const h=Math.round(10+6*Math.sin(x/37)+4*Math.sin(x/13)),top=72-h;R("#93cf77",x,top,1,h+10);P("#b2e08f",x,top);P("#a5d985",x,top+1);
 for(let y=top+6;y<82;y++)if((x+y)%2&&y>top+8)P("#84c26b",x,y)}
for(let k=0;k<70;k++){const x=rnd()*WW|0,y=58+rnd()*16|0;P("#7fbd66",x,y);P("#a5d985",x,y-1)}
// trees: round leafy ones and the odd pine, each with a soft shadow
const leafy=(tx,ty)=>{for(let x=-10;x<=10;x++)P("#6aac58",tx+x,ty+17+(Math.abs(x)>7));R("#6aac58",tx-7,ty+16,15,2);
 R("#5a3a22",tx-2,ty,5,17);R("#7a4f2e",tx-1,ty,3,17);R("#956340",tx-1,ty,1,17);P("#5a3a22",tx,ty+6);P("#5a3a22",tx+1,ty+11);R("#5a3a22",tx-3,ty+15,7,2);
 disc("#2f6a37",tx+1,ty-3,10);disc("#3f8441",tx+1,ty-3,9);disc("#4f9a46",tx,ty-5,8);disc("#5fb052",tx-2,ty-7,6);disc("#79c45e",tx-3,ty-9,3);P("#a4dc7c",tx-4,ty-10);P("#a4dc7c",tx-3,ty-11);
 for(let n=0;n<26;n++){const a=rnd()*6.28,r=rnd()*8,px=tx+Math.cos(a)*r|0,py=ty-5+Math.sin(a)*r|0;P(r>5&&Math.sin(a)>-.2?"#3f8441":"#6dbb57",px,py);P("#2f6a37",px+1,py+1)}};
const pine=(tx,ty)=>{R("#6aac58",tx-6,ty+16,13,2);R("#5a3a22",tx-1,ty+10,3,7);P("#7a4f2e",tx,ty+10);
 for(let k=0;k<4;k++){const y0=ty-14+k*6,w0=3+k*2;for(let y=0;y<7;y++){const w=Math.round(w0*y/6)+1;R("#2c5e3c",tx-w,y0+y,w*2+1,1);R("#3d7a4a",tx-w+1,y0+y,w,1);if(y>1)P("#5a9a5f",tx-w+1,y0+y)}}P("#2c5e3c",tx,ty-15)};
for(let tx=14,n=0;tx<WW;tx+=46+(n*17)%30,n++){const ty=52+(n*5)%7;n%4===2?pine(tx,ty):leafy(tx,ty)}
// meadow with grass tufts
R("#7cc66a",0,78,WW,H-78);
for(let k=0;k<420;k++){const x=rnd()*WW|0,y=79+rnd()*61|0;if(y>GROUND-10&&y<GROUND+7)continue;
 if(k%3){P("#66b157",x,y);P("#66b157",x+2,y);P("#66b157",x+1,y-1);P("#9bd884",x+1,y-2)}else{P("#8ad077",x,y);P("#5aa34f",x,y+1)}}
for(let k=0;k<14;k++){const x=rnd()*WW|0,y=124+rnd()*12|0;for(let d=0;d<5;d++)for(let e=0;e<3;e++)if((d+e)%2)P("#70b960",x+d,y+e)}
// fence: lit posts with caps and shadows, two shaded rails
for(let x=0;x<WW;x+=12){R("#8a5a33",x+3,79,5,14);R("#c08850",x+4,80,3,12);R("#dca46a",x+4,80,1,12);R("#9a6a3c",x+6,80,1,12);R("#e8bb7f",x+4,79,3,1);R("#6aac58",x+3,93,6,1)}
for(const ry of[83,88]){R("#8a5a33",0,ry-1,WW,1);R("#d8a56d",0,ry,WW,2);R("#ecc58f",0,ry,WW,1);R("#a87444",0,ry+2,WW,1)}
for(let x=0;x<WW;x+=12){R("#c08850",x+4,82,3,1);R("#c08850",x+4,87,3,1);P("#dca46a",x+4,82);P("#dca46a",x+4,87)}

 preview(){this.tok={};scene(`<h3>Preview</h3>${card(toy,false)}`);
  say(LINES.recipe.preview,[OUT,["💾 Save",()=>this.save(),"go"]])},
 async save(){if(!book.includes(toy))book.push(toy);this.tok={};const tok=this.tok;scene(`<div class="soon">✔ Saved to my book</div>`);say(LINES.recipe.saved,[OUT]);
  await sleep(1400);if(inScene&&this.tok===tok)this.search()},
 search(){this.tok={};scene(`<h3>🔍 Search my book</h3><p style="margin:0 0 8px">What do you have, or what are you craving?</p><div class="grid" id="ex"></div>`);
  ["I have eggs and rice","something cozy for a cold day","garlic","something sweet"].forEach(q=>{const bt=document.createElement("button");bt.textContent=q;bt.onclick=()=>this.run(q);$("ex").append(bt)});
  say(LINES.recipe.search,[OUT])},
 async run(text){scene(`<h3>🔍 Search my book</h3><div class="search" id="q"></div><div id="rs"></div>`);typeOut($("q"),text);await sleep(text.length*14+300);if(!$("rs"))return;
  const stop=["for","the","and","have","something","with","what","can","make","day"];
  const words=text.toLowerCase().split(/\W+/).filter(w=>w.length>2&&!stop.includes(w)),has=(a,w)=>a.some(x=>x.includes(w)||w.includes(x));
  const res=book.map(r=>{const kw=words.filter(w=>has([r.t.toLowerCase(),...r.ing,...r.tags],w)),mean=words.filter(w=>has(r.mood,w));
   return{r,kw,word:Math.min(1,kw.length/2),meaning:Math.min(1,(mean.length+kw.length*.5)/2)}}).map(o=>({...o,s:o.word+o.meaning})).filter(o=>o.s>0).sort((a,b)=>b.s-a.s);
  $("rs").innerHTML=res.map(o=>`<div class="res" onclick="recipe.open(${book.indexOf(o.r)})">${icon(o.r.pic,4)}<div><b>${o.r.t}</b><div style="font-size:13px">💬 ${o.kw.length?"Uses "+o.kw.join(" and ")+" from your search.":"Fits the mood: "+o.r.mood.slice(0,2).join(", ")+"."}</div></div>
   <div class="bars">meaning<span class="bar"><i style="width:${o.meaning*100}%"></i></span><br>words&nbsp;&nbsp;&nbsp;<span class="bar"><i style="width:${o.word*100}%"></i></span></div></div>`).join("")||"No matches.";
  say(LINES.recipe.results,[OUT,["↺ Again",()=>this.search()]])},
 async open(k,vi=false,line=LINES.recipe.open){const r=book[k];this.tok={};scene(card(r,vi));
  // Once it's in Vietnamese, the demo is finished: Done goes back to the start.
  if(vi)return say(line,[["✔ Done",()=>this.start(),"go"],OUT]);
  const toggle=async()=>{if(r.done)return this.open(k,true,LINES.recipe.cached);
   const tok=this.tok;$("panelWrap").firstChild.classList.add("busy");say(LINES.recipe.translating,[["⏳ Translating…",()=>{}],OUT]);
   await sleep(900);r.done=1;if(inScene&&this.tok===tok)this.open(k,true,LINES.recipe.translated)};
  say(line,[["↺ Again",()=>this.search()],["Tiếng Việt",toggle,"go"],OUT])}};
function card(r,vi){return`<h3>${icon(r.pic,5)} ${vi?r.vi:r.t}</h3><b>${vi?"Nguyên liệu":"Ingredients"}</b><div class="ing">${(vi?r.ingVi:r.ing).map((n,k)=>`<span>${icon(ING[r.ing[k]],2)||"🌿"} ${n}</span>`).join("")}</div>
 <b>${vi?"Cách làm":"Steps"}</b><ol style="margin:4px 0 10px;padding-left:22px">${(vi?r.stepsVi:r.steps).map(x=>`<li>${x}</li>`).join("")}</ol>`}

/* ---------------- controls ---------------- */
drawFace();fit();addEventListener("resize",fit);
// "Jump to" menu so visitors can skip straight to any signboard
$("jump").innerHTML=stops.map((s,k)=>`<option value="${k}">${k===0?"🏡 Start":k===stops.length-1?"🏁 End":"📍 "+(s.proj.title.length>30?s.proj.title.slice(0,28)+"…":s.proj.title)}</option>`).join("");
$("jump").onchange=e=>{i=+e.target.value;x=stops[i].x;shown=-1;e.target.blur()};
addEventListener("keydown",e=>{if(/ArrowRight|KeyD/.test(e.code))go(1);if(/ArrowLeft|KeyA/.test(e.code))go(-1);
 if(e.code==="Escape"){if(inScene)leave();else if(parent!==window)parent.postMessage({type:"sparky-close"},location.origin)}if(e.code==="Space"&&!inScene){e.preventDefault();jump()}if(e.code==="Enter"&&!inScene)enter()});
$("prev").onclick=()=>go(-1);$("next").onclick=()=>go(1);
cv.onclick=e=>{const r=cv.getBoundingClientRect(),px=(e.clientX-r.left)/r.width*W+cam,py=(e.clientY-r.top)/r.height*VH-(VH-H);
 if(Math.abs(px-x)<12&&py>GROUND-26)jump();else go(px<x?-1:1)};
const openAt=stops.findIndex(s=>s.scene&&s.scene===new URLSearchParams(location.search).get("open"));
if(openAt>0){i=openAt;x=stops[i].x;shown=i;enter()}
draw();
</script></body></html>

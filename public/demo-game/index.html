<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Project Walk</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=DM+Sans:wght@400;500&display=swap">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--wood:#6b4423;--wood2:#a86f3d;--paper:#fff8e7;--ink:#3b2a20;--mute:#8a7464;--sage:#6aa84f}
*{box-sizing:border-box}
html,body{height:100%}body{margin:0;background:#2b2233;color:#f5ead8;font:16px 'Pixelify Sans',monospace}
/* fixed zones: game view (flexes), dialog box and button bar (fixed heights) */
.game{height:100%;display:flex;flex-direction:column;background:var(--wood)}
.stage{flex:1;min-height:0;position:relative;overflow:hidden;background:#a9e1f5}
canvas#c{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.px{image-rendering:pixelated;vertical-align:middle}
button{font:inherit;cursor:pointer;border:3px solid var(--wood);background:var(--paper);color:var(--ink);padding:4px 12px;min-height:40px;border-radius:4px;box-shadow:0 3px 0 var(--wood)}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--wood)}
button.go{background:var(--sage);color:#fff;border-color:#3f6e2c;box-shadow:0 3px 0 #3f6e2c}
button.on{background:#ffd34d}
/* dialog box */
.dialog{flex:none;height:112px;position:relative;display:flex;gap:10px;background:var(--paper);color:var(--ink);border-top:6px solid var(--wood);padding:8px 12px;cursor:pointer;user-select:none}
.face{flex:none;width:64px;height:64px;background:#e9dcc0;border:3px solid var(--wood2);image-rendering:pixelated}
.dname{font-weight:600;color:#c0563f}.dtx{height:3.9em;overflow:hidden;line-height:1.3;white-space:pre-line}
#more{position:absolute;right:12px;bottom:6px;color:#c0563f;animation:bob 1s steps(2) infinite}@keyframes bob{50%{transform:translateY(3px)}}
.ctrlbar{flex:none;display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--wood)}.ctrlbar .arrow{flex:none;width:52px}
#dbtn{flex:1;min-width:0;display:flex;gap:8px;justify-content:center;overflow-x:auto}#dbtn button{white-space:nowrap}
#jump{position:absolute;top:8px;left:8px;z-index:3;font:inherit;font-size:14px;max-width:70%;padding:4px 6px;border:3px solid var(--wood);background:var(--paper);color:var(--ink)}
body.inscene #jump{display:none}body.inscene .arrow{display:none}
/* buttons stay centered; say() always puts Outside last */
.panel{animation:fadein .25s ease-out}@keyframes fadein{from{opacity:0;transform:translateY(6px)}}.panel.busy{opacity:.55;transition:opacity .2s}
/* in-game scene */
#scene{--px:3px;--wp:4px;display:none;position:absolute;inset:0;overflow:hidden;
 background:repeating-linear-gradient(#c98f5a 0 14px,#b57d4b 14px 16px) bottom/100% 30% no-repeat,repeating-linear-gradient(90deg,#f6e3c6 0 14px,#f0d6ae 14px 28px)}
body.inscene canvas#c{display:none}
@media(max-width:600px){#scene{--px:2px;--wp:3px}}
.deco{position:absolute;image-rendering:pixelated;pointer-events:none}#panelWrap{position:absolute;left:10px;right:10px;top:10px;bottom:calc(var(--px)*30 + 16px);overflow-y:auto;z-index:1}#panelWrap .panel{max-width:560px}body.short #panelWrap{bottom:10px}
.steam{position:absolute;width:var(--px);height:var(--px);background:#fff;opacity:0;animation:steam 2.4s linear infinite}
@keyframes steam{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(calc(var(--px)*-12));opacity:0}}body.inscene #scene{display:block}
.panel{background:var(--paper);color:var(--ink);border:4px solid var(--wood);border-radius:6px;box-shadow:4px 4px 0 #0003;padding:12px;max-width:600px;margin:0 auto}
.panel h3{margin:0 0 8px;font-size:20px;display:flex;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.big{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px}
.steps div{color:var(--mute);padding:2px 0}.steps .done{color:var(--ink)}.steps .done::before{content:"✔ ";color:var(--sage)}
.ing{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.ing span{background:#f3ead6;border-radius:4px;padding:2px 8px 2px 4px;display:flex;align-items:center;gap:4px}
.res{display:flex;align-items:center;gap:10px;padding:6px;border-bottom:2px dashed #e3d6bb;cursor:pointer}.res:hover{background:#f6efdc}
.bars{margin-left:auto;font-size:13px;color:var(--mute)}.bar{display:inline-block;width:60px;height:8px;background:#e3d6bb;vertical-align:middle;margin-left:4px}.bar i{display:block;height:100%;background:var(--sage)}
.search{background:#fff;border:3px solid #e3d6bb;border-radius:4px;padding:6px 10px;margin-bottom:8px;min-height:36px}
.card-photo{background:#fffdf5;background-image:repeating-linear-gradient(#fffdf5 0 19px,#cfe0f2 19px 20px);padding:4px 12px;font:italic 15px/20px 'Comic Sans MS',cursive;color:#3a4a7a;transform:rotate(-1.5deg);max-width:260px;border:1px solid #e3d9bf;margin:4px auto}
.wave{display:flex;gap:2px;align-items:center;justify-content:center;height:34px}.wave i{width:4px;background:var(--sage)}
.out{white-space:pre-wrap;background:#f3ead6;border-radius:4px;padding:8px;min-height:70px}
.soon{background:#ffd34d33;border:3px dashed #e0a458;border-radius:6px;padding:16px;text-align:center;font-size:18px;margin-top:8px}.panel a{color:#2f5aa8}
.deco[data-room]{display:none}#scene.kitchen .deco[data-room=kitchen],#scene.library .deco[data-room=library],#scene.office .deco[data-room=office],#scene.hpc .deco[data-room=hpc]{display:block}
#scene.hpc{background:repeating-linear-gradient(#aab6c2 0 14px,#98a5b2 14px 16px) bottom/100% 30% no-repeat,repeating-linear-gradient(90deg,#e7e3f0 0 14px,#ddd8ea 14px 28px)}#scene.hpc.running .led{animation-duration:.25s}
.jobs{display:grid;grid-template-columns:repeat(24,1fr);gap:2px;margin:6px 0}.jobs i{aspect-ratio:1;background:#e3d6bb}.jobs i.on{background:#5fb052}.jobs i.run{background:#ffd34d}
.count{font:600 22px ui-monospace,Menlo,monospace;text-align:center}.chart{display:block;width:100%;height:130px;background:#fff;border:2px solid #e3d6bb}
#scene.library{background:repeating-linear-gradient(#b57d4b 0 14px,#a06b3c 14px 16px) bottom/100% 30% no-repeat,repeating-linear-gradient(90deg,#e3ead6 0 14px,#d8e2c8 14px 28px)}
#scene.office{background:repeating-linear-gradient(#aab6c2 0 14px,#98a5b2 14px 16px) bottom/100% 30% no-repeat,repeating-linear-gradient(90deg,#e1e8f0 0 14px,#d6dfea 14px 28px)}
.deco.talk{animation-duration:.3s!important}.chat{display:flex;gap:8px;align-items:flex-start;margin:6px 0;animation:fadein .25s ease-out}.chat img{width:24px;height:28px;image-rendering:pixelated;flex:none}.chat .bub{flex:1;background:#f3ead6;padding:4px 8px}.chat b{display:block;font-size:13px}
.led{position:absolute;width:var(--px);height:var(--px);background:#5fe08a;animation:blink 1.4s steps(2) infinite}@keyframes blink{50%{opacity:.25}}
.claim{display:flex;gap:8px;align-items:flex-start;padding:6px;border-bottom:2px dashed #e3d6bb}.claim small{display:block;color:var(--mute);font-size:12px}.claim.drop{color:var(--mute)}.claim.drop span.t{text-decoration:line-through}
.grade{flex:none;font-size:12px;padding:1px 6px;margin-left:auto}.g-Strong{background:#cfe8c9}.g-Moderate{background:#fbe6b0}.g-Weak{background:#f6c9c9}
.claim .vote{flex:none;display:flex;gap:4px;margin-left:auto}.claim .vote button{padding:2px 8px;min-width:0}.claim.ok{background:#eef7e9}.claim.no{background:#fbeeee;color:var(--mute)}
.json{font:13px/1.45 ui-monospace,Menlo,monospace;background:#f3ead6;padding:8px;white-space:pre-wrap;margin:0 0 8px}.json .bad{background:#f6c9c9}
.steps .fail{color:#b5475a}.steps .fail::before{content:"✗ "}.err{background:#fbeeee;border:2px solid #e8a3a3;padding:6px 8px;font:13px ui-monospace,Menlo,monospace;margin-top:6px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl td,.tbl th{padding:4px 6px;border-bottom:2px dashed #e3d6bb;text-align:left}.tbl th{color:var(--mute);font-weight:600;font-size:12px}.tbl tr.new{background:#fff3c4}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.chips button{padding:4px 10px}.tag{font-size:12px;padding:1px 6px;background:#f3ead6}.tag.rel{background:#cfe8c9}.tag.ip{background:#fbe6b0}
*{border-radius:0!important}#pcard{position:absolute;z-index:2;left:10px;bottom:50%;width:min(340px,calc(100% - 20px));background:#111b2e;border:1px solid #1a2744;border-radius:14px!important;padding:16px 18px;color:#8a9ab5;font:13px/1.6 "DM Sans",system-ui,sans-serif;box-shadow:0 8px 24px #0005;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;transform:translateY(6px)}#pcard.on{opacity:1;pointer-events:auto;transform:none}#pcard::after{content:"";position:absolute;bottom:-7px;left:var(--ax,50%);width:12px;height:12px;margin-left:-6px;background:#111b2e;border:1px solid #1a2744;border-width:0 1px 1px 0;transform:rotate(45deg)}#pcard .hd{display:flex;gap:8px;align-items:baseline;padding-right:16px}#pcard h4{flex:1;margin:0;font:600 19px/1.2 "Cormorant Garamond",Georgia,serif;color:#e0e7f3}#pcard .yr{font-size:11px;color:#475b7a;white-space:nowrap}#pcard p{margin:6px 0 0}#pcard .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}#pcard .tags span{font-size:11px;color:#6db89f;background:rgba(109,184,159,.12);padding:2px 8px;border-radius:5px!important}#pcard .lk{display:flex;gap:14px;margin-top:10px;font-size:11px}#pcard a{color:#6db89f;text-decoration:none}#pcard .x{position:absolute;top:6px;right:8px;background:none;border:0;color:#475b7a;font-size:14px;cursor:pointer;padding:2px 4px;box-shadow:none}@media(max-height:560px){#pcard p{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}}body.inscene #pcard{display:none}/* card in the game's paper style: pixel title, plain readable text */#pcard{background:#fff8e7;border:3px solid #6b4423;border-radius:0!important;box-shadow:4px 4px 0 #0003;color:#3b2a20;font:14px/1.5 "DM Sans",system-ui,sans-serif}#pcard h4{font:600 18px/1.25 "Pixelify Sans",monospace;color:#3b2a20}#pcard .yr,#pcard .x{color:#8a7464}#pcard::after{background:#fff8e7;border-color:#6b4423;border-width:0 3px 3px 0;bottom:-9px}.card-photo{transform:none!important}
</style></head><body>
<div class="game">
 <div class="stage" id="stage"><canvas id="c"></canvas><select id="jump" aria-label="Jump to a project"></select><div id="pcard" aria-live="polite"></div><div id="scene"><div id="deco"></div><div id="panelWrap"></div></div></div>
 <div class="dialog" id="dbox"><canvas class="face" id="face" width="20" height="20"></canvas>
  <div style="flex:1;min-width:0"><div class="dname" id="dname">Sparky</div><div class="dtx" id="dtx"></div></div><span id="more">▼</span></div>
 <div class="ctrlbar"><button class="arrow" id="prev" aria-label="Walk back">◀</button><div id="dbtn"></div><button class="arrow" id="next" aria-label="Walk forward">▶</button></div>
</div>
<script>
const $=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms));
/* ---------------- pixel sprites ---------------- */
const PAL={K:"#2a1a1f",R:"#e8603c",G:"#5fb052",H:"#9ad27a",W:"#fffaf0",Y:"#ffd34d",P:"#c98bd6",L:"#ecd3f2",B:"#7fb3d5",O:"#e9a65a",N:"#f6d58a",D:"#6b3f22",S:"#9a9aa8"};
const bowl=["KKKKKKKK","KBBBBBBK",".KBBBBK.","..KKKK..","........"];
const ICON={
 tomato:["...GG...","..KGGK..",".KRRRRK.","KRRWRRRK","KRRRRRRK","KRRRRRRK",".KRRRRK.","..KKKK.."],
 egg:["..KKKK..",".KWWWWK.","KWWYYWWK","KWYYYYWK","KWYYYYWK","KWWYYWWK",".KWWWWK.","..KKKK.."],
 onion:["...KK...","...GK...","..KPPK..",".KPPPPK.","KPPLPPPK","KPPLPPPK",".KPPPPK.","..KKKK.."],
 garlic:[["...KK...","...WK...","..KWWK..",".KWWWWK.","KWWSWWWK","KWWSWWWK",".KWWWWK.","..KKKK.."]],
 rice:["........","..WWWW..",".WWWWWW.",...bowl],
 noodles:["........",".NONNON.",".NNONNN.",...bowl],
 soup:["........",".RRWRRR.",".RWWRRR.",...bowl],
 banana:["......K.",".....KYK","....KYYK","...KYYK.","KKKYYK..","KYYYK...",".KKK....","........"],
 peas:["........","........","..KKKKK.",".KGHGHGK","KGGGGGK.",".KKKKK..","........","........"],
 soy:["...KK...","...RK...","..KDDK..",".KDDDDK.",".KDWWDK.",".KDWWDK.",".KDDDDK.","..KKKK.."],
 butter:["........","........","...KKKKK","..KYYYYK",".KYYYYKK","KYYYYKK.","KKKKKK..","........"],
 pancake:["........","...YY...","..KYYK..",".KOOOOK.",".KNNNNK.","KOOOOOOK","KKKKKKKK","........"],
 link:["..KKKK..",".KBBGBK.","KBGGBBBK","KBBGGBBK","KBBBGGBK","KBGBBBBK",".KBBBBK.","..KKKK.."],
 pdf:[".KKKKK..",".KWWWKK.",".KWWWWK.",".KRRRWK.",".KWWWWK.",".KWKKWK.",".KWWWWK.",".KKKKKK."],
 card:["........","KKKKKKKK","KWWWWWWK","KWRRRWWK","KWWWWWWK","KWKKKKWK","KWWWWWWK","KKKKKKKK"],
 mic:["..KKK...",".KSSSK..",".KSSSK..",".KSSSK..","K.KKK.K.",".K...K..","..KKK...","...K...."],
 book:["KKKKKKK.","KRRRRRKK","KRYRRRKW","KRRRRRKW","KRRRRRKW","KRRRRRKW","KKKKKKKW",".WWWWWWW"]};
ICON.garlic=ICON.garlic[0];
const urlCache={};
function icon(k,s=4){if(!ICON[k])return"";if(!urlCache[k]){const c=document.createElement("canvas");c.width=c.height=8;const x=c.getContext("2d");
 ICON[k].forEach((r,y)=>[...r].forEach((ch,xx)=>{if(PAL[ch]){x.fillStyle=PAL[ch];x.fillRect(xx,y,1,1)}}));urlCache[k]=c.toDataURL()}
 return`<img class="px" src="${urlCache[k]}" width="${8*s}" height="${8*s}" alt="">`}
const ING={tomato:"tomato",egg:"egg",onion:"onion",garlic:"garlic",rice:"rice",noodles:"noodles",banana:"banana",peas:"peas","soy sauce":"soy",butter:"butter",stock:"soup"};

/* ---------------- characters ---------------- */
// Sparky, facing right. alt = walk frame, eye = row hidden on blink, head = rows that bob when idle
const CH={
 dog:{rows:[".........K..K.....","........KOK.KPK...","........KOOKKPPK..","........KOOOOOOK..","........KOOOOEOOKK","........KOOOOOCCCN",
  "K.......KOOOOCCCK.","OK.....KRRRCCCKK..",".OKKKKBBBBBCK.....",".KOOOOBbBBBCK.....",".KOOOOBBBbBCK.....",".KOOOOOOOOCCK.....",
  "..KOK.....KCK.....","..KOK.....KCK.....","..KCK.....KCK.....","..KK......KK......"],
  alt:{12:"...KOK...KCK......",13:"...KOK...KCK......",14:"...KCK...KCK......",15:"...KK....KK......."},eye:4,skin:"O",head:8,
  pal:{K:"#3b2a20",O:"#d9a05b",P:"#f3c9a6",C:"#fbe9cf",E:"#1a1416",N:"#1a1416",R:"#c0392b",B:"#2f5aa8",b:"#ffffff"}}};
const who="dog";
function drawChar(c,x,feet,dir,walking,step,t,lift=0){const sp=CH[who],w=sp.rows[0].length,h=sp.rows.length,
  blink=(t%240)<8,bob=walking?0:(t/30|0)%2,x0=Math.round(x)-(w>>1);
 c.fillStyle="#0002";c.fillRect(x0+1,feet,w-2,1);
 sp.rows.forEach((r,yy)=>{if(step&&sp.alt[yy])r=sp.alt[yy];if(blink&&yy===sp.eye)r=r.replaceAll("E",sp.skin);
  [...r].forEach((ch,xx)=>{if(!sp.pal[ch])return;c.fillStyle=sp.pal[ch];c.fillRect(x0+(dir>0?xx:w-1-xx),feet-h+yy-lift+(yy<sp.head&&!lift?bob:0),1,1)})})}
function drawFace(){const c=$("face").getContext("2d"),sp=CH[who];c.clearRect(0,0,20,20);
 const w=sp.rows[0].length,h=sp.rows.length,ox=(20-w)>>1,oy=(20-h)>>1;
 sp.rows.forEach((r,y)=>[...r].forEach((ch,x)=>{if(sp.pal[ch]){c.fillStyle=sp.pal[ch];c.fillRect(ox+x,oy+y,1,1)}}))}

/* ---------------- Sparky's lines: edit these! ---------------- */
// Keep them short. " Woof!" is added to the end of every line automatically.
const LINES={
 hello:"Hi! I'm Sparky, Jessica's dog. Let's go for a walk!",
 howto:"Tap ◀ ▶ to walk, or tap me to make me jump!",
 bye:"That's the tour! Thanks for the pets.",
 peek:"Wanna peek inside?",
 // what Sparky says at each signboard, matched by project title
 projects:{
  "Recipe Book AI":"Jessica's recipe book. I'm mostly here for the chicken.",
  "High Definition Single Base Substitution Mutational Signatures in Human Cancers":"Big science about tiny DNA typos. Very fancy.",
  "SigProfilerCurator":"Robots read the papers, Jessica double-checks. Good robots.",
  "ENCODEd Database":"A giant genome library. I'd fetch from it if they let me."},
 projectDefault:"Sniff sniff… a project!",
 soon:"Still being built! Come back soon for treats.",
 explain:"Want to see how Jessica built it? Lots of wires, no bones.",
 curator:{
  start:"Welcome to the library! Pick a signature and the robots fetch the papers.",
  reading:"The robots are talking it over. No chewing the pages!",
  claims:"Every claim gets a grade and a source. One didn't hold up, so it's out.",
  review:"Your turn, curator! Tap ✔ or ✗ on each claim.",
  needOne:"Approve at least one claim first!",
  published:"Published! People and chat assistants can both ask it now."},
 hdsbs:{
  start:"Welcome to the server room! 50,000+ genomes is way too many for one computer.",
  running:"The whole cluster is on it. Zoom zoom!",
  done:"Done! Here's one toy signature at SBS96. Tap the bigger numbers to zoom in.",
  96:"SBS96: the mutation plus one neighbor on each side.",
  288:"SBS288: each of the 96 split by DNA strand.",
  1536:"SBS1536: two neighbors on each side. So much more detail!",
  4608:"SBS4608: two neighbors each side plus strand. See the peaks hiding in that one bar?"},
 encode:{
  start:"This is the ENCODE portal. Pick a file to submit. The schema guards the door!",
  checking:"Checking it against the schema…",
  fail:"Uh oh, the schema said no. Let's fix it!",
  pass:"It passed! It waits as in progress until it's released.",
  released:"Released! Now anyone can find it.",
  browse:"Tap a filter to narrow the files, like the real portal."},
 recipe:{
  start:"Welcome in! Let's add a recipe. Where's it from?",
  url:"The recipe's hiding in the web page. The app sniffs it right out!",
  pdf:"The AI fishes the recipe out of the PDF and tidies it up.",
  photo:"Handwritten cards become real recipes. Paw prints and all!",
  voice:"Even recipes from a phone call with Mom, in Vietnamese and English!",
  preview:"Nothing saves until Jessica says so. Good human.",
  saved:"Saved and sniffable! I mean searchable.",
  search:"Now let's search! Fridge stuff or a craving?",
  results:"Sorted by meaning and by words. Tap one!",
  open:"Yum! Now try Tiếng Việt.",
  translating:"Translating…",
  translated:"All in Vietnamese now, and saved for next time!",
  cached:"Instant! It remembered."}};

/* ---------------- dialog ---------------- */
// Text is split into pages that fit the box; tap the box to finish typing or go to the next page.
let typer,pages=[],pg=0,typing=false;
function paginate(text){const el=$("dtx"),parts=text.match(/[^.!?…]+[.!?…]*\s*/g)||[text],out=[];let cur="";
 for(const p of parts){el.textContent=cur+p;if(cur&&el.scrollHeight>el.clientHeight+1){out.push(cur.trim());cur=p}else cur+=p}
 if(cur.trim())out.push(cur.trim());el.textContent="";return out}
function typePage(){clearInterval(typer);const el=$("dtx"),t=pages[pg]||"";let n=0;typing=true;el.textContent="";
 $("more").style.visibility="hidden";
 typer=setInterval(()=>{el.textContent=t.slice(0,n+=2);if(n>=t.length)doneTyping()},18)}
function doneTyping(){clearInterval(typer);typing=false;$("dtx").textContent=pages[pg]||"";$("more").style.visibility=pg<pages.length-1?"visible":"hidden"}
function say(text,buttons=[]){pages=text?paginate(text+" Woof!"):[""];pg=0;typePage();
 $("dbtn").innerHTML="";[...buttons].sort((a,b)=>(a[2]==="out")-(b[2]==="out")).forEach(([label,fn,cls])=>{const b=document.createElement("button");b.innerHTML=label;if(cls)b.className=cls;b.onclick=fn;$("dbtn").append(b)})}
$("dbox").onclick=()=>{if(typing)doneTyping();else if(pg<pages.length-1){pg++;typePage()}};

 async open(k,vi=false,line=LINES.recipe.open){const r=book[k];this.tok={};scene(card(r,vi));

   const tok=this.tok;$("panelWrap").firstChild.classList.add("busy");say(LINES.recipe.translating,[["⏳ Translating…",()=>{}],OUT]);

function card(r,vi){return`<h3>${icon(r.pic,5)} ${vi?r.vi:r.t}</h3><b>${vi?"Nguyên liệu":"Ingredients"}</b><div class="ing">${(vi?r.ingVi:r.ing).map((n,k)=>`<span>${icon(ING[r.ing[k]],2)||"🌿"} ${n}</span>`).join("")}</div>

/* ---------------- SigProfilerCurator library ---------------- */
// Toy run: real, well-known biology for each signature; papers and citations are made up.
const SIGS={
 SBS1:{about:"Clock-like",claims:[["Caused by spontaneous deamination of 5-methylcytosine.","Strong",3],["The count grows with age in most cancer types.","Strong",1],["Higher in tissues whose cells divide often.","Moderate",5],["Only found in children's cancers.","Weak",2,1]]},
 SBS4:{about:"Tobacco smoking",claims:[["Associated with tobacco smoking.","Strong",1],["Mostly found in lung and head and neck cancers.","Strong",4],["Strand bias suggests repair of bulky DNA damage.","Moderate",6],["Caused by drinking coffee.","Weak",3,1]]},
 SBS7a:{about:"UV light",claims:[["Caused by ultraviolet (UV) light exposure.","Strong",2],["Mostly found in skin cancers such as melanoma.","Strong",5],["C>T changes where two pyrimidines sit side by side.","Moderate",1],["Caused by sunscreen.","Weak",4,1]]}};
const gradeTag=g=>`<span class="grade g-${g}">${g}</span>`;
const curator={
 start(){this.tok={};scene(`<h3>📚 SigProfilerCurator</h3><p style="margin:0 0 8px">Pick a mutational signature. The agents will read up on it.</p><div class="grid">${Object.entries(SIGS).map(([k,v])=>`<button class="big" onclick="curator.run('${k}')"><b>${k}</b><span style="font-size:13px">${v.about}</span></button>`).join("")}</div>`);
  say(LINES.curator.start,[OUT])},
 async run(k){const tok=this.tok={},c=SIGS[k].claims,drop=c.find(x=>x[3]),kept=c.length-1;
  const talk=[[0,`Found 6 toy papers on ${k}. Passing them to Reader!`],[1,`Read all 6. I pulled out ${c.length} claims.`],[2,`Checking each claim against its paper…`],
   [2,`Reader, where does "${drop[0].replace(/\.$/,"")}" come from?`],[1,`Toy paper #${drop[2]}… hmm, it doesn't actually say that.`],[2,`Then it's out. The other ${kept} hold up.`],
   [3,`Drafted ${kept} cited claims, graded by evidence. Over to the human curator!`]];
  scene(`<h3>🤖 Agents on ${k}</h3><div id="log"></div>`);say(LINES.curator.reading,[OUT,["⏭ Skip",()=>{this.quiet();this.claims(k)}]]);
  for(const [n,t] of talk){if(this.tok!==tok||!inScene||!$("log"))return this.quiet();this.quiet();$("bot"+n).classList.add("talk");
   const row=document.createElement("div");row.className="chat";row.innerHTML=`<img src="${BOTS[n].img||(BOTS[n].img=botImg(BOTS[n].c))}" alt=""><div class="bub"><b style="color:${BOTS[n].ink}">${BOTS[n].name}</b><span></span></div>`;
   $("log").append(row);typeOut(row.querySelector("span"),t);const w=$("panelWrap");w.scrollTop=w.scrollHeight;await sleep(t.length*14+750)}
  this.quiet();await sleep(400);if(this.tok===tok)this.claims(k)},
 quiet(){BOTS.forEach((b,n)=>$("bot"+n)&&$("bot"+n).classList.remove("talk"))},
 claims(k){this.tok={};scene(`<h3>📝 Draft claims · ${k}</h3>${SIGS[k].claims.map(([t,g,p,drop])=>`<div class="claim${drop?" drop":""}"><div><span class="t">${t}</span><small>${drop?"✗ Not supported by its source, dropped":"📄 Toy paper #"+p}</small></div>${drop?"":gradeTag(g)}</div>`).join("")}`);
  say(LINES.curator.claims,[OUT,["🧑‍🔬 Review",()=>this.review(k),"go"]])},
 review(k){this.tok={};const kept=SIGS[k].claims.filter(c=>!c[3]);this.votes=kept.map(()=>0);
  scene(`<h3>🧑‍🔬 Curator review · ${k}</h3>${kept.map(([t,g,p],n)=>`<div class="claim" id="cl${n}"><div>${t}<small>📄 Toy paper #${p} · ${g}</small></div><span class="vote"><button onclick="curator.vote(${n},1)">✔</button><button onclick="curator.vote(${n},-1)">✗</button></span></div>`).join("")}`);
  say(LINES.curator.review,[OUT,["📚 Publish",()=>this.publish(k),"go"]])},
 vote(n,v){this.votes[n]=v;$("cl"+n).className="claim"+(v>0?" ok":" no")},
 async publish(k){const kept=SIGS[k].claims.filter(c=>!c[3]),ok=kept.filter((c,n)=>this.votes[n]>0);if(!ok.length)return say(LINES.curator.needOne,[OUT,["📚 Publish",()=>this.publish(k),"go"]]);
  const tok=this.tok={};scene(`<h3>📖 ${k} · ${SIGS[k].about}</h3>${ok.map(([t,g,p])=>`<div class="claim"><div>${t}<small>📄 Toy paper #${p}</small></div>${gradeTag(g)}</div>`).join("")}
   <p style="margin:10px 0 4px"><b>🤖 Ask the reference</b></p><div class="search" id="q"></div><div class="out" id="a" style="min-height:0"></div>`);
  say(LINES.curator.published,[["✔ Done",()=>this.start(),"go"],OUT]);
  typeOut($("q"),`What do we know about ${k}?`);await sleep(900);if(this.tok!==tok)return;typeOut($("a"),`${ok[0][0]} (${ok[0][1].toLowerCase()} evidence, toy paper #${ok[0][2]})`)}};

/* ---------------- HD SBS server room ---------------- */
// Toy signature: each SBS96 bar is split unevenly into its finer channels, so hidden peaks show up as the resolution goes up.
const HD=(()=>{let z=12345;const r=()=>(z=(z*16807)%2147483647)/2147483647,v96=[],w16=[],ws=[];
 for(let p=0;p<96;p++){v96.push(.05+r()*.25+(p===42?1.6:p===38||p===46?.7:0));const a=p===42?[.02,.03,.22,.02,.04,.02,.03,.16,.02,.02,.05,.26,.02,.03,.02,.06]:Array.from({length:16},()=>Math.pow(r(),4)+.02),t=a.reduce((x,y)=>x+y);w16.push(a.map(x=>x/t));
  const b=p===42?[.62,.28,.1]:[.35+r()*.4,.2+r()*.3,.1+r()*.1],u=b[0]+b[1]+b[2];ws.push(b.map(x=>x/u))}
 const lv={96:p=>[v96[p]],288:p=>ws[p].map(x=>v96[p]*x),1536:p=>w16[p].map(x=>v96[p]*x),4608:p=>w16[p].flatMap(x=>ws[p].map(y=>v96[p]*x*y))};
 return n=>Array.from({length:96},(_,p)=>lv[n](p)).flat()})();
const HDCOL=["#03bcee","#2a2a33","#e32926","#cac8c9","#a1ce63","#ebc6c4"],HDTXT={96:"6 substitution types × 16 neighbor pairs",288:"96 × 3 strand states",1536:"6 substitution types × 256 neighbor sets (two bases each side)",4608:"1,536 × 3 strand states"};
function drawHD(cv,n){const d=devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;cv.width=w*d;cv.height=h*d;const c=cv.getContext("2d");c.scale(d,d);
 const v=HD(n),m=Math.max(...v),bw=(w-8)/v.length,per=v.length/96,base=h-18;
 v.forEach((x,k)=>{c.fillStyle=HDCOL[Math.floor(k/per/16)];c.globalAlpha=n===288||n===4608?[1,.6,.35][k%3]:1;c.fillRect(4+k*bw,base-x/m*(base-6),Math.max(bw-(bw>2?1:0),.6),x/m*(base-6))});
 c.globalAlpha=1;const x0=4+42*per*bw,x1=4+43*per*bw;c.fillStyle="#3b2a20";c.fillRect(x0,base+3,x1-x0,1);c.fillRect(x0,base+1,1,3);c.fillRect(x1-1,base+1,1,3);
 c.font="10px sans-serif";c.textAlign="center";c.fillText("one SBS96 bar",Math.min(Math.max((x0+x1)/2,40),w-40),base+14);
 const z=$("hdz"),zw=z.clientWidth,zh=z.clientHeight;z.width=zw*d;z.height=zh*d;const q=z.getContext("2d");q.scale(d,d);const kids=v.slice(42*per,43*per),km=Math.max(...kids),gw=Math.min(40,(zw-8)/kids.length);
 kids.forEach((x,k)=>{q.fillStyle="#e32926";q.globalAlpha=n===288||n===4608?[1,.6,.35][k%3]:1;q.fillRect((zw-gw*kids.length)/2+k*gw,zh-4-x/km*(zh-10),Math.max(gw-(gw>3?1:0),1),x/km*(zh-10))})}
const hdsbs={
 start(){this.tok={};$("scene").classList.remove("running");scene(`<h3>🖥️ HD Signatures</h3><p style="margin:0 0 8px">50,000+ whole genomes across many cancer types. Each one has thousands of mutations to count in context.</p><div class="soon" style="font-size:16px">Too big for one computer. Time for the cluster!</div>`);
  say(LINES.hdsbs.start,[OUT,["🚀 Submit to the cluster",()=>this.run(),"go"]])},
 async run(){const tok=this.tok={},N=240,steps=["Splitting genomes into jobs","Counting mutations in context","Extracting signatures"];$("scene").classList.add("running");
  scene(`<h3>🚀 Cluster job</h3><div class="count" id="cn">0 genomes</div><div class="jobs" id="jb">${"<i></i>".repeat(N)}</div><div class="steps" id="st">${steps.map(x=>`<div>${x}…</div>`).join("")}</div>`);
  say(LINES.hdsbs.running,[OUT,["⏭ Skip",()=>this.show(96)]]);const cells=$("jb").children,order=[...Array(N).keys()].sort((a,b)=>((a*97)%N)-((b*97)%N)),rows=$("st").children;
  for(let k=0;k<N;k+=8){await sleep(40);if(this.tok!==tok||!inScene)return;for(let j=k;j<k+8;j++){cells[order[j]].className="on";if(j+12<N)cells[order[j+12]].className="run"}
   $("cn").textContent=Math.round((k+8)/N*50000).toLocaleString()+(k+8>=N?"+":"")+" genomes";if(k===48)rows[0].className="done";if(k===160)rows[1].className="done"}
  rows[2].className="done";$("scene").classList.remove("running");await sleep(600);if(this.tok===tok&&inScene)this.show(96,LINES.hdsbs.done)},
 show(n,line){this.tok={};$("scene").classList.remove("running");scene(`<h3>🔬 Toy signature · SBS${n}</h3><div class="chips">${[96,288,1536,4608].map(k=>`<button${k===n?' class="go"':""} onclick="hdsbs.show(${k})">SBS${k}</button>`).join("")}</div>
   <canvas class="chart" id="hd"></canvas><p style="margin:6px 0 2px;font-size:13px;color:var(--mute)">Inside that one bar: ${n/96} channel${n>96?"s":""}</p><canvas class="chart" id="hdz" style="height:60px"></canvas><p style="margin:6px 0 0;font-size:14px">${n.toLocaleString()} channels: ${HDTXT[n]}.</p>`);
  drawHD($("hd"),n);say(line||LINES.hdsbs[n],n===4608?[["✔ Done",()=>this.start(),"go"],OUT]:[OUT])}};

/* ---------------- ENCODE portal office ---------------- */
// Toy submission checked against a toy version of the portal's JSON schema.
const GOOD={dataset:"ENCSR000TOY",file_format:"fastq",output_type:"reads",md5sum:"3f2a9c1d7be04e5a8c6d2f1b9a0e7c4d",lab:"toy-lab",award:"TOY-AWARD"};
const SUBS={good:{label:"✅ Good file",doc:GOOD},nomd5:{label:"❓ Missing md5sum",doc:(({md5sum,...r})=>r)(GOOD)},fmt:{label:"❌ Wrong format",doc:{...GOOD,file_format:"txt"}}};
const RULES=[["file_format is fastq, bam, bed, bigWig…",d=>["fastq","bam","bed","bigWig"].includes(d.file_format),"file_format","'txt' is not one of ['fastq', 'bam', 'bed', 'bigWig', …]"],
 ["md5sum is there and 32 characters",d=>d.md5sum&&d.md5sum.length===32,"md5sum","'md5sum' is a required property"],
 ["lab and award are filled in",d=>d.lab&&d.award],["dataset links to an experiment",d=>/^ENCSR/.test(d.dataset)]];
const FILES=[["ENCFF001TOY","bam","ChIP-seq"],["ENCFF002TOY","bigWig","ATAC-seq"],["ENCFF003TOY","bed","ChIP-seq"],["ENCFF004TOY","fastq","ATAC-seq"]];
const encode={
 start(){this.tok={};scene(`<h3>🧬 ENCODE portal · Submit a file</h3><p style="margin:0 0 8px">Every submission is checked against the portal's JSON schema before it's stored.</p><div class="grid">${Object.entries(SUBS).map(([k,v])=>`<button class="big" onclick="encode.submit('${k}')">${v.label}</button>`).join("")}</div>`);
  say(LINES.encode.start,[OUT])},
 async submit(k,doc=SUBS[k].doc){const tok=this.tok={},bad=RULES.find(r=>!r[1](doc));
  const json=JSON.stringify(doc,null,1).replace(/\n\s*/g,"\n  ").replace("\n  }","\n}");
  scene(`<h3>📤 POST /files/</h3><div class="json">${bad&&bad[2]&&doc[bad[2]]!==undefined?json.replace(`"${bad[2]}": "${doc[bad[2]]}"`,`<span class="bad">"${bad[2]}": "${doc[bad[2]]}"</span>`):json}</div><div class="steps" id="st">${RULES.map(r=>`<div>${r[0]}</div>`).join("")}</div><div id="er"></div>`);
  say(LINES.encode.checking,[OUT]);const rows=$("st").children;
  for(let n=0;n<RULES.length;n++){await sleep(550);if(this.tok!==tok)return;const ok=RULES[n][1](doc);rows[n].className=ok?"done":"fail";if(!ok){
   $("er").innerHTML=`<div class="err">422 Unprocessable Entity<br>${RULES[n][3]}</div>`;return say(LINES.encode.fail,[OUT,["🔧 Fix it",()=>this.submit(k,GOOD),"go"]])}}
  await sleep(400);if(this.tok===tok)this.stored(false)},
 stored(rel){this.tok={};scene(`<h3>📄 ENCFF000TOY</h3><table class="tbl"><tr><th>Dataset</th><td>ENCSR000TOY</td></tr><tr><th>Format</th><td>fastq · reads</td></tr><tr><th>Assay</th><td>RNA-seq</td></tr><tr><th>Status</th><td><span class="tag ${rel?"rel":"ip"}">${rel?"released":"in progress"}</span></td></tr></table>`);
  rel?say(LINES.encode.released,[OUT,["🔍 Browse files",()=>this.browse("All"),"go"]]):say(LINES.encode.pass,[OUT,["🚀 Release",()=>this.stored(true),"go"]])},
 browse(f){this.tok={};const rows=[["ENCFF000TOY","fastq","RNA-seq",1],...FILES].filter(r=>f==="All"||r[2]===f);
  scene(`<h3>🔍 Files</h3><div class="chips">${["All","RNA-seq","ChIP-seq","ATAC-seq"].map(c=>`<button${c===f?' class="go"':""} onclick="encode.browse('${c}')">${c}</button>`).join("")}</div>
   <table class="tbl"><tr><th>Accession</th><th>Format</th><th>Assay</th><th>Status</th></tr>${rows.map(r=>`<tr${r[3]?' class="new"':""}><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td><span class="tag rel">released</span></td></tr>`).join("")}</table>`);
  say(LINES.encode.browse,[["✔ Done",()=>this.start(),"go"],OUT])}};

/* ---------------- controls ---------------- */
drawFace();fit();addEventListener("resize",fit);
// "Jump to" menu so visitors can skip straight to any signboard
$("jump").innerHTML=stops.map((s,k)=>`<option value="${k}">${k===0?"🏡 Start":k===stops.length-1?"🏁 End":"📍 "+(s.proj.title.length>30?s.proj.title.slice(0,28)+"…":s.proj.title)}</option>`).join("");
$("jump").onchange=e=>{i=+e.target.value;x=stops[i].x;shown=-1;e.target.blur()};
addEventListener("keydown",e=>{if(/ArrowRight|KeyD/.test(e.code))go(1);if(/ArrowLeft|KeyA/.test(e.code))go(-1);
 if(e.code==="Escape"){if(inScene)leave();else if(parent!==window)parent.postMessage({type:"sparky-close"},location.origin)}// Space or Enter goes inside at a sign (jumps elsewhere); inside a room it presses the green button. Focused buttons and links keep their own Space/Enter.
 if(/^(Space|Enter|NumpadEnter)$/.test(e.code)&&!e.target.closest?.("button,a,select,input")){e.preventDefault();
  if(inScene){const b=$("dbtn").querySelector("button.go");if(b)b.click()}else if(stops[i].scene&&shown===i)enter();else if(e.code==="Space")jump()}});
// Blur after a click so Space/Enter go back to the game instead of re-pressing the arrow.

cv.onclick=e=>{const r=cv.getBoundingClientRect(),px=(e.clientX-r.left)/r.width*W+cam,py=(e.clientY-r.top)/r.height*VH-(VH-H);
 if(Math.abs(px-x)<12&&py>GROUND-26)jump();else go(px<x?-1:1)};
const openAt=stops.findIndex(s=>s.scene&&s.scene===new URLSearchParams(location.search).get("open"));
if(openAt>0){i=openAt;x=stops[i].x;shown=i;enter()}
